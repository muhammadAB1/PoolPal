  <style>
    .section-title {
      font-family: Poppins, Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #15171A;
    }
    .value {
      font-family: Poppins, Arial, sans-serif;
      font-size: 10.5px;
      font-weight: 500;
      fill: #15171A;
    }
    .status {
      font-family: Poppins, Arial, sans-serif;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .15px;
      fill: #15171A;
    }
    .footer {
      font-family: Poppins, Arial, sans-serif;
      font-size: 8.5px;
      font-weight: 400;
      fill: #4E535B;
    }
    .swatch {
      stroke: #6B7077;
      stroke-width: .75;
      vector-effect: non-scaling-stroke;
      shape-rendering: geometricPrecision;
    }
    .ideal-range {
      fill: none;
      stroke: #17191C;
      stroke-width: 1.4;
      vector-effect: non-scaling-stroke;
    }
    .divider {
      stroke: #E1E3E7;
      stroke-width: 1;
