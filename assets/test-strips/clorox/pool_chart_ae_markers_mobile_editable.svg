<svg xmlns="http://www.w3.org/2000/svg"
 width="358" height="742" viewBox="0 0 358 742"
 preserveAspectRatio="xMidYMid meet"
 role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Mobile pool test-strip color chart with A–E markers</title>
<desc id="chart-desc">Editable vector chart with uniform square swatches, exact values, and source A–E marker labels.</desc>
<style>
.row-title {
  font-family: Poppins, Arial, sans-serif;
  font-size: 12.5px;
  font-weight: 600;
  fill: #191B1E;
}
.unit {
  font-family: Poppins, Arial, sans-serif;
  font-size: 9px;
  font-weight: 400;
  fill: #51565E;
}
.marker {
  font-family: Poppins, Arial, sans-serif;
  font-size: 9.5px;
  font-weight: 600;
  fill: #191B1E;
}
.value {
  font-family: Poppins, Arial, sans-serif;
  font-size: 9.5px;
  font-weight: 500;
  fill: #191B1E;
}
.swatch {
  stroke: #898F97;
  stroke-width: .75;
  vector-effect: non-scaling-stroke;
  shape-rendering: geometricPrecision;
}
.divider {
  stroke: #E2E5E9;
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
}
</style>
<g id="chart">
