<svg xmlns="http://www.w3.org/2000/svg"
 width="358" height="710" viewBox="0 0 358 710"
 preserveAspectRatio="xMidYMid meet"
 role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Editable pool test-strip color chart with row labels above</title>
<desc id="chart-desc">Mobile-ready vector chart with uniform independently editable swatches.</desc>
<style>
.row-title {
  font-family: Poppins, Arial, sans-serif;
  font-size: 12.5px;
  font-weight: 600;
  fill: #17191C;
}
.unit {
  font-family: Poppins, Arial, sans-serif;
  font-size: 9px;
  font-weight: 400;
  fill: #4D525A;
}
.value {
  font-family: Poppins, Arial, sans-serif;
  font-size: 10.5px;
  font-weight: 500;
  fill: #17191C;
}
.status {
  font-family: Poppins, Arial, sans-serif;
  font-size: 8.5px;
  font-weight: 500;
  fill: #17191C;
  letter-spacing: .1px;
}
.footnote {
  font-family: Poppins, Arial, sans-serif;
  font-size: 7.8px;
  font-weight: 400;
  fill: #4D525A;
}
.swatch {
  stroke: #8A9098;
  stroke-width: .65;
  vector-effect: non-scaling-stroke;
  shape-rendering: geometricPrecision;
}
.divider {
  stroke: #E1E4E8;
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
}
</style>
<g id="chart">
