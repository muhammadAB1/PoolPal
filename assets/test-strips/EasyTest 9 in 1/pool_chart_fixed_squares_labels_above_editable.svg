<svg xmlns="http://www.w3.org/2000/svg" width="358" height="834" viewBox="0 0 358 834" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Pool test strip chart with square swatches and labels above rows</title>
<desc id="chart-desc">Vector reconstruction using the original colors and range indications, adapted to a mobile layout with square swatches, labels above each row, and more vertical spacing.</desc>
<style>
.row-title { font-family:Poppins,Arial,sans-serif; font-size:12.5px; font-weight:600; fill:#15171A; }
.unit { font-family:Poppins,Arial,sans-serif; font-size:9px; font-weight:400; fill:#4F545C; }
.value { font-family:Poppins,Arial,sans-serif; font-size:10.5px; font-weight:500; fill:#15171A; }
.status { font-family:Poppins,Arial,sans-serif; font-size:8.8px; font-weight:500; fill:#15171A; }
.bracket-label { font-family:Poppins,Arial,sans-serif; font-size:8.8px; font-weight:500; fill:#15171A; }
.note { font-family:Poppins,Arial,sans-serif; font-size:7.8px; font-weight:400; fill:#4F545C; }
.swatch { stroke:#8A9098; stroke-width:.65; vector-effect:non-scaling-stroke; shape-rendering:geometricPrecision; }
.bracket { fill:none; stroke:#1D2025; stroke-width:1.15; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
.divider { stroke:#E3E6EA; stroke-width:1; vector-effect:non-scaling-stroke; }
</style>
