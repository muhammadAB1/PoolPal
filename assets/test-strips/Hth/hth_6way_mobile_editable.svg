<svg xmlns="http://www.w3.org/2000/svg"
 width="358" height="682" viewBox="0 0 358 682"
 preserveAspectRatio="xMidYMid meet"
 role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">HTH 6-way test-strip mobile color chart</title>
<desc id="chart-desc">Editable vector chart with uniform square swatches and labels above each row.</desc>
<style>
.row-title {
  font-family: Poppins, Arial, sans-serif;
  font-size: 12.5px;
  font-weight: 600;
  fill: #15171A;
}
.value {
  font-family: Poppins, Arial, sans-serif;
  font-size: 10.5px;
  font-weight: 500;
  fill: #15171A;
}
.swatch {
  stroke: #92979E;
  stroke-width: 0.75;
  vector-effect: non-scaling-stroke;
  shape-rendering: geometricPrecision;
}
.divider {
  stroke: #E3E6EA;
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
}
</style>
<g id="chart">
