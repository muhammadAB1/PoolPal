<path id="free-chlorine-bromine-ideal-left" class="ideal-line" d="M106.0,200 V205 H146.0"/>
<path id="free-chlorine-bromine-ideal-right" class="ideal-line" d="M190.0,205 H230.0 V200"/>
<text id="free-chlorine-bromine-ideal-label" class="ideal-label" x="168.0" y="206" text-anchor="middle" dominant-baseline="middle">IDEAL</text>
