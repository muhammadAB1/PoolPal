<svg xmlns="http://www.w3.org/2000/svg"
    width="358" height="686" viewBox="0 0 358 686"
    preserveAspectRatio="xMidYMid meet"
    role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Editable pool test-strip reference chart</title>
  <desc id="chart-desc">Mobile-ready vector chart reconstructed from the attached source, with the 150 strips badge removed.</desc>
  <style>
    .title {
      font-family: Poppins, Arial, sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      fill: #121417;
    }
    .unit {
      font-family: Poppins, Arial, sans-serif;
      font-size: 9.5px;
      font-weight: 500;
      fill: #121417;
    }
    .value {
      font-family: Poppins, Arial, sans-serif;
      font-size: 10.5px;
      font-weight: 500;
      fill: #121417;
    }
    .secondary-value {
      font-family: Poppins, Arial, sans-serif;
      font-size: 10px;
      font-weight: 500;
      fill: #079FD9;
    }
    .ideal-label {
      font-family: Poppins, Arial, sans-serif;
      font-size: 9px;
      font-weight: 600;
      fill: #1351AF;
    }
    .small-note {
      font-family: Poppins, Arial, sans-serif;
      font-size: 7.5px;
      font-weight: 500;
      fill: #121417;
    }
    .footnote {
      font-family: Poppins, Arial, sans-serif;
      font-size: 7.6px;
      font-weight: 400;
      fill: #4B5058;
    }
    .swatch {
      stroke: #858A91;
      stroke-width: .65;
      vector-effect: non-scaling-stroke;
      shape-rendering: geometricPrecision;
    }
    .ideal-line {
      fill: none;
      stroke: #1351AF;
      stroke-width: 1.2;
      vector-effect: non-scaling-stroke;
    }
    .divider {
      stroke: #E2E5E9;
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }
  </style>
  <g id="chart">

    <g id="row-01-total-hardness" data-test="total-hardness">
      <text id="total-hardness-title" class="title" x="16" y="19" dominant-baseline="middle">Total Hardness</text>
      <text id="total-hardness-unit" class="unit" x="122" y="19" dominant-baseline="middle">(ppm)</text>
      <text id="total-hardness_0_01-value" class="value" x="33.0" y="45" text-anchor="middle" dominant-baseline="middle">0</text>
      <rect id="total-hardness_0_01" class="swatch" x="16.0" y="56" width="34" height="34" fill="#02AFDD" data-value="0" data-hex="#02AFDD"/>
      <text id="total-hardness_100_02-value" class="value" x="78.0" y="45" text-anchor="middle" dominant-baseline="middle">100</text>
      <rect id="total-hardness_100_02" class="swatch" x="61.0" y="56" width="34" height="34" fill="#039FDC" data-value="100" data-hex="#039FDC"/>
      <text id="total-hardness_250_03-value" class="value" x="123.0" y="45" text-anchor="middle" dominant-baseline="middle">250</text>
      <rect id="total-hardness_250_03" class="swatch" x="106.0" y="56" width="34" height="34" fill="#0277CB" data-value="250" data-hex="#0277CB"/>
      <text id="total-hardness_500_04-value" class="value" x="168.0" y="45" text-anchor="middle" dominant-baseline="middle">500</text>
      <rect id="total-hardness_500_04" class="swatch" x="151.0" y="56" width="34" height="34" fill="#0140B5" data-value="500" data-hex="#0140B5"/>
<path id="total-hardness-ideal-left" class="ideal-line" d="M61.0,98 V103 H101.0"/>
<path id="total-hardness-ideal-right" class="ideal-line" d="M145.0,103 H185.0 V98"/>
<text id="total-hardness-ideal-label" class="ideal-label" x="123.0" y="104" text-anchor="middle" dominant-baseline="middle">IDEAL</text>
      <line class="divider" x1="16" y1="111" x2="342" y2="111"/>
    </g>
    <g id="row-02-free-chlorine-bromine" data-test="free-chlorine-bromine">
